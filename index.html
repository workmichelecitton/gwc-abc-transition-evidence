<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC &amp; Transition Evidence Explorer — Global WASH Cluster</title>
<style>
:root{
  --ink:#16212B; --ink-2:#5A6B7A; --ink-3:#8797A5;
  --line:#DFE6EC; --bg:#F5F8FA; --card:#FFFFFF;
  --accent:#1F5C8B;
  /* categorical — nominal classes */
  --abc:#1F5C8B; --transition:#C0662B; --fundamentals:#4A7C59;
  --barrier:#B33A3A; --enabler:#2E7D5B; --recommendation:#6B4E9E;
  --practice:#177B8A; --context:#7A8794;
  /* sequential single hue — ordered values */
  --s-low:#CFE0EC; --s-med:#6C9FC4; --s-high:#1F5C8B;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
header{background:var(--card);border-bottom:1px solid var(--line);padding:22px 26px 0}
h1{margin:0;font-size:21px;letter-spacing:-.2px}
.sub{color:var(--ink-2);font-size:13px;margin-top:5px}
.stats{display:flex;gap:26px;margin:16px 0 0;flex-wrap:wrap}
.stat b{display:block;font-size:22px;line-height:1.1;color:var(--accent)}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3)}
nav{display:flex;gap:2px;margin-top:18px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;
  font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer}
nav button:hover{color:var(--ink)}
nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:20px 26px 70px;max-width:1240px}
.filters{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:18px}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.frow + .frow{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);
  min-width:74px;font-weight:600}
input[type=search],select{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);
  border-radius:5px;background:#fff;color:var(--ink)}
input[type=search]{flex:1;min-width:200px}
.chip{font-size:12.5px;padding:4px 11px;border:1px solid var(--line);border-radius:20px;
  background:#fff;cursor:pointer;color:var(--ink-2);user-select:none}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.chip.on[data-k=theme][data-v=Transition]{background:var(--transition);border-color:var(--transition)}
.chip.on[data-k=theme][data-v=Fundamentals]{background:var(--fundamentals);border-color:var(--fundamentals)}
.chip.on[data-k=type][data-v=barrier]{background:var(--barrier);border-color:var(--barrier)}
.chip.on[data-k=type][data-v=enabler]{background:var(--enabler);border-color:var(--enabler)}
.chip.on[data-k=type][data-v=recommendation]{background:var(--recommendation);border-color:var(--recommendation)}
.chip.on[data-k=type][data-v=practice]{background:var(--practice);border-color:var(--practice)}
.chip.on[data-k=type][data-v=context]{background:var(--context);border-color:var(--context)}
.reset{margin-left:auto;background:none;border:0;color:var(--accent);font:inherit;font-size:13px;
  cursor:pointer;text-decoration:underline}
.count{color:var(--ink-2);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ink-3);
  border-radius:7px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.card:hover{border-color:var(--ink-3)}
.card.barrier{border-left-color:var(--barrier)} .card.enabler{border-left-color:var(--enabler)}
.card.recommendation{border-left-color:var(--recommendation)}
.card.practice{border-left-color:var(--practice)} .card.context{border-left-color:var(--context)}
.card h3{margin:0 0 9px;font-size:15px;font-weight:600;line-height:1.45}
.meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11.5px}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--ink-2)}
.pill{border-radius:4px;padding:2px 8px;color:#fff;font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.4px}
.pill.ABC{background:var(--abc)} .pill.Transition{background:var(--transition)}
.pill.Fundamentals{background:var(--fundamentals)}
h2.grp{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:#5A6675;
  margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid #DDE2E8;
  display:flex;align-items:baseline;gap:9px}
h2.grp:first-child{margin-top:6px}
.hlgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
.hlcol{min-width:0}
.hlcol .hl{padding:14px 16px;margin-bottom:9px}
.hlcol .hl>*{max-width:none}
.hlcol .hl h3{font-size:15px;line-height:1.3}
.hlcol .hl-plain{font-size:13.5px;line-height:1.5}
.hlcol .hl-so{font-size:12.5px;padding:7px 10px}
.hlcol .meta{font-size:11px}
.hlnote{margin:-4px 0 10px;font-size:12px;color:var(--ink-3);font-style:italic}
@media (max-width:1100px){ .hlgrid{grid-template-columns:1fr} }
.grp-n{font-size:12px;color:#8A94A2;font-weight:400;letter-spacing:0}
/* One illustrative case, marked as such. The statement above it is the claim;
   this is one instance of it, and the records below are the full range. */
.eg{margin:6px 0 0;padding:7px 11px;border-left:3px solid var(--fundamentals);background:#F4F6F9;
    font-size:13px;line-height:1.5;color:#3A4551;border-radius:0 4px 4px 0}
.pill.barrier{background:var(--barrier)} .pill.enabler{background:var(--enabler)}
.pill.recommendation{background:var(--recommendation)} .pill.practice{background:var(--practice)}
.pill.context{background:var(--context)}
.str{border-radius:4px;padding:2px 8px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.str.low{background:var(--s-low);color:#25506F} .str.medium{background:var(--s-med);color:#fff}
.str.high{background:var(--s-high);color:#fff}
.detail{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.ev{padding:10px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
.ev p{margin:0 0 5px}
blockquote{margin:6px 0;padding:7px 12px;border-left:2px solid var(--line);
  color:var(--ink-2);font-style:italic;background:var(--bg);border-radius:0 4px 4px 0}
.evmeta{font-size:11.5px;color:var(--ink-3)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
  border-radius:7px;overflow:hidden;font-size:13.5px}
th{text-align:left;padding:9px 12px;background:var(--bg);font-size:11px;text-transform:uppercase;
  letter-spacing:.6px;color:var(--ink-3);border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:12px 14px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile b{display:block;font-size:15px;margin-bottom:3px}
.tile span{font-size:12px;color:var(--ink-2)}
.mtable td.n{text-align:center;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.mtable td.n:hover{outline:2px solid var(--accent);outline-offset:-2px}
.empty{color:var(--ink-2);padding:34px;text-align:center;background:var(--card);
  border:1px dashed var(--line);border-radius:7px}
.warn{background:#FFF6E5;border:1px solid #E8CE9A;color:#6B4E12;padding:13px 16px;
  border-radius:7px;margin-bottom:16px;font-size:13.5px}
.warn code{background:#fff;padding:1px 5px;border-radius:3px;font-size:12.5px}
footer{padding:22px 26px;color:var(--ink-3);font-size:12px;border-top:1px solid var(--line);background:var(--card)}
.hidden{display:none}
/* About */
.prose{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:26px 32px}
/* Prose is full width to match the filter bar and the finding cards, but a
   1200px measure is unreadable, so the text inside is held to a sane column. */
.prose>*{max-width:82ch}
.aboutstats{display:flex;gap:26px;flex-wrap:wrap;margin:14px 0 4px;padding:14px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);max-width:none}
.aboutstats .stat b{font-size:24px}
.prose h2{margin:0 0 6px;font-size:20px;letter-spacing:-.2px}
.prose h3{margin:26px 0 8px;font-size:15px;color:var(--accent)}
.prose p{margin:0 0 11px}
.prose .lead{font-size:16px;line-height:1.6;color:var(--ink)}
.prose ul{margin:0 0 11px;padding-left:20px}
.prose li{margin-bottom:5px}
.prose .note{color:var(--ink-2);font-size:13.5px}
.prose .caveats li{margin-bottom:8px;color:var(--ink-2)}
.strengthtable{margin:10px 0 6px;font-size:13.5px}
.strengthtable td:first-child{white-space:nowrap}
/* Map */
.mapwrap{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:12px 16px 10px;margin-bottom:14px}
.maphead{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-2);
  margin-bottom:6px}
.linkbtn{margin-left:auto;background:none;border:0;color:var(--accent);font:inherit;
  font-size:12.5px;cursor:pointer;text-decoration:underline}
.map{width:100%;height:auto;max-height:380px;display:block}
.land{fill:#E9EEF2;stroke:#DCE4EA;stroke-width:.4}
.cty{stroke:#fff;stroke-width:.5;cursor:pointer;transition:fill .12s}
.cty:hover{stroke:var(--ink);stroke-width:1}
.cty.sel{stroke:var(--transition);stroke-width:1.6;fill:var(--transition) !important}
.maplegend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);
  margin-top:4px;flex-wrap:wrap}
.lg{width:26px;height:9px;border-radius:2px;display:inline-block}
.lg.lo{background:rgba(31,92,139,.22)} .lg.hi{background:rgba(31,92,139,.92);margin-left:10px}
.lgnote{margin-left:12px;font-style:italic}
text.ctyl{font-size:6.5px;font-weight:600;fill:#12325180;text-anchor:middle;
  paint-order:stroke;stroke:#FFFFFFC0;stroke-width:1.6px;pointer-events:none;
  letter-spacing:.02em}
text.ctyl.sel{fill:var(--transition);stroke:#FFF;stroke-width:2px}
.ctylist{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:4px}
.ctylist .maphead{grid-column:1/-1;margin:0 0 4px}
.ctybtn{display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:none;border:1px solid transparent;border-radius:5px;cursor:pointer;
  padding:4px 8px;font:inherit;font-size:13px;color:var(--ink-2);text-align:left}
.ctybtn:hover{background:var(--bg);border-color:var(--line)}
.ctybtn.on{background:var(--transition);border-color:var(--transition);color:#fff;font-weight:600}
.ctyn{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ctybtn.on .ctyn{color:#FFFFFFCC}
.note-inline{font-size:11.5px;color:var(--ink-3);font-style:italic}
/* Highlights */
.hl{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--s-high);
  border-radius:8px;padding:20px 24px;margin-bottom:12px}
.hl>*{max-width:82ch}
.hl h3{margin:0 0 8px;font-size:18px;line-height:1.35;letter-spacing:-.2px}
.hl-plain{margin:0 0 10px;font-size:15.5px;line-height:1.6}
.hl-so{margin:0 0 12px;padding:9px 13px;background:var(--bg);border-radius:5px;
  font-size:14px;color:var(--ink)}
.hl-so b{color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>Area-Based Coordination &amp; Transition — Evidence Explorer</h1>
  <div class="sub">Global WASH Cluster · beta · evidence from country conversations, secondary data reviews, workshops and horizon scans</div>
  <div class="stats" id="stats"></div>
  <nav id="nav"></nav>
</header>

<main>
  <div id="boot" class="empty">Loading evidence…</div>

  <div id="app" class="hidden">
    <div class="filters">
      <div class="frow">
        <input type="search" id="q" placeholder="Search statements and sources…">
        <select id="country"></select>
        <select id="tag"></select>
        <select id="actor"></select>
        <button class="reset" id="reset">Reset all filters</button>
      </div>
      <div class="frow" id="selrow"><span class="flabel">Countries</span><span id="selcountries"></span></div>
      <div class="frow"><span class="flabel">Theme</span><span id="f-theme"></span></div>
      <div class="frow"><span class="flabel">Type</span><span id="f-type"></span></div>
      <div class="frow"><span class="flabel">Source</span><span id="f-stream"></span></div>
      <div class="frow"><span class="flabel">Strength</span><span id="f-strength"></span>
        <span class="flabel" style="margin-left:18px">Level</span><span id="f-level"></span></div>
      <div class="frow"><span class="flabel">Group by</span>
        <select id="groupby">
          <option value="strength">Strength of evidence</option>
          <option value="theme">Theme</option>
          <option value="type">Type</option>
          <option value="">No grouping</option>
        </select></div>
    </div>
    <p class="count" id="count"></p>
    <div id="view"></div>
  </div>
</main>

<footer id="foot"></footer>

<!-- Fallback copy of the data, so this page also works when opened directly
     from disk. Ignored when the page is served over http. -->
<script src="data/site.js" onerror="void 0"></script>
<!-- Map geometry. Generated once from Natural Earth 110m, simplified, committed
     as data. Regenerate only if the country list changes. -->
<script src="data/geo.js" onerror="void 0"></script>

<script>
"use strict";

// ---------------------------------------------------------------------------
// This file renders data. It never contains data. Everything below reads from
// data/site.json, which the GitHub Action generates from the CSV masters.
// To change what the site says, edit data/evidence.csv — never this file.
// ---------------------------------------------------------------------------

var D = null;                       // the loaded dataset
var TAB = "about";
var F = { q:"", theme:[], type:[], stream:[], strength:[], level:[],
          countries:[], tag:"", actor:"" };
var OPEN = {};                      // which finding cards are expanded

// Matrix removed 2026-08. It existed to show where evidence was thick and thin
// while the base was being built; with all sources in and the consolidation
// done, it told a reader nothing the Findings filters do not. viewMatrix() went
// with it — recover from git if a coverage view is ever wanted again.
var TABS = [["about","About"],["highlights","Highlights"],["findings","Findings"],
            ["sources","Sources"]];
var NOFILTER = { about:1 };         // views the filter bar does not apply to
var MAPON = true;                   // map shown above the findings list
// Grouping the findings list. Deliberately NOT by tag: findings carry 3.3 tags
// on average, so a tag grouping would list most cards three times over. The tag
// dropdown already scopes the list to one tag, which is the same job without
// the duplication. Strength first is the default because it puts what the base
// is most confident about at the top.
var GROUPBY = "strength";
var GROUPS = {
  strength: { order: ["high","medium","low"],
              label: function(v){ return label("strength", v) || v; },
              of: function(f){ return f.strength; } },
  theme:    { order: ["ABC","Transition","Fundamentals"],
              label: function(v){ return label("theme", v) || v; },
              of: function(f){ return f.theme.slice().sort().join(" + "); } },
  type:     { order: ["barrier","enabler","practice","context","recommendation"],
              label: function(v){ return label("type", v) || v; },
              of: function(f){ return f.type; } }
};

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function label(key, value){
  var list = (D.taxonomy[key]||[]);
  for (var i=0;i<list.length;i++) if (list[i].value===value) return list[i].label||value;
  return value;
}
function countryName(iso){ return (D.taxonomy.countries||{})[iso] || iso; }
function uniq(a){ return a.filter(function(v,i){ return a.indexOf(v)===i; }); }

// --- load ------------------------------------------------------------------
// Served over http: fetch site.json, always current.
// Opened from disk: fetch is blocked, so fall back to data/site.js, which the
// build writes alongside site.json and which a <script> tag can load locally.
fetch("data/site.json", {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(function(json){ D = json; init(); })
  .catch(function(e){
    if (window.SITE_DATA) { D = window.SITE_DATA; init(); return; }
    el("boot").innerHTML =
      '<div class="warn" style="text-align:left"><b>Could not load the data.</b><br><br>' +
      'Neither <code>data/site.json</code> nor the local fallback ' +
      '<code>data/site.js</code> could be read.<br><br>' +
      'If you are working locally, run <code>python scripts/build.py</code> first — ' +
      'it writes both files.<br><br>' +
      'If you are seeing this on the published site, the last build failed. ' +
      'Check the Actions tab on GitHub.<br><br>' +
      '<span style="color:#8797A5">' + esc(e.message) + '</span></div>';
  });

function init(){
  el("boot").classList.add("hidden");
  el("app").classList.remove("hidden");

  var s = D.stats;
  el("stats").innerHTML =
    stat(s.findings,"Findings") + stat(s.records,"Evidence records") +
    stat(s.sources,"Sources") + stat(s.countries,"Countries");

  el("nav").innerHTML = TABS.map(function(t){
    return '<button data-tab="'+t[0]+'" aria-selected="'+(t[0]===TAB)+'">'+t[1]+'</button>';
  }).join("");
  el("nav").onclick = function(e){
    var b = e.target.closest("button"); if(!b) return;
    TAB = b.dataset.tab;
    [].forEach.call(el("nav").children, function(c){
      c.setAttribute("aria-selected", c.dataset.tab===TAB); });
    render();
  };

  chips("f-theme","theme","theme");
  chips("f-type","type","type");
  chips("f-stream","stream","stream");
  chips("f-strength","strength",null,[["high","High"],["medium","Medium"],["low","Low"]]);
  chips("f-level","level","level");

  dropdown("country","Add a country…",
    uniq(D.records.reduce(function(a,r){ return a.concat(r.countries); },[]))
      .sort(function(a,b){ return countryName(a).localeCompare(countryName(b)); })
      .map(function(c){ return [c, countryName(c)]; }));
  dropdown("tag","All themes",
    (D.taxonomy.tags||[]).map(function(t){ return [t.value, t.label]; }));
  dropdown("actor","All actors",
    (D.taxonomy.actors||[]).map(function(t){ return [t.value, t.label]; }));

  el("groupby").value = GROUPBY;
  el("groupby").onchange = function(){ GROUPBY = this.value; render(); };

  el("q").oninput = function(){ F.q = this.value.toLowerCase().trim(); render(); };
  ["tag","actor"].forEach(function(k){
    el(k).onchange = function(){ F[k] = this.value; render(); };
  });
  // The country dropdown adds to the selection rather than replacing it.
  el("country").onchange = function(){
    if (this.value) toggleCountry(this.value, true);
    this.value = "";
  };
  el("reset").onclick = function(){
    F = { q:"", theme:[], type:[], stream:[], strength:[], level:[], countries:[], tag:"", actor:"" };
    el("q").value = ""; ["country","tag","actor"].forEach(function(k){ el(k).value=""; });
    document.querySelectorAll(".chip.on").forEach(function(c){ c.classList.remove("on"); });
    render();
  };

  el("foot").innerHTML =
    "Global WASH Cluster · beta · data generated " + esc(D.generated) +
    " · taxonomy v" + esc(D.taxonomy_version) +
    " · strength of evidence is computed from the number of independent sources and streams, not asserted." +
    (D.stats.withheld_internal ? " · " + D.stats.withheld_internal +
      " record(s) marked internal are excluded from this build." : "");

  render();
}

function stat(n, l){ return '<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>'; }

function chips(target, key, taxKey, explicit){
  var opts = explicit || (D.taxonomy[taxKey]||[]).map(function(t){ return [t.value, t.label||t.value]; });
  el(target).innerHTML = opts.map(function(o){
    return '<button class="chip" data-k="'+key+'" data-v="'+esc(o[0])+'">'+esc(o[1])+'</button>';
  }).join(" ");
  el(target).onclick = function(e){
    var b = e.target.closest(".chip"); if(!b) return;
    var v = b.dataset.v, i = F[key].indexOf(v);
    if (i<0) { F[key].push(v); b.classList.add("on"); }
    else { F[key].splice(i,1); b.classList.remove("on"); }
    render();
  };
}

function dropdown(id, blank, pairs){
  el(id).innerHTML = '<option value="">'+blank+'</option>' + pairs.map(function(p){
    return '<option value="'+esc(p[0])+'">'+esc(p[1])+'</option>'; }).join("");
}

// --- filtering -------------------------------------------------------------
// Records are filtered first. Findings are then kept if any of their records
// survive — so a country filter shows the finding AND which evidence backs it
// in that country, rather than dropping a global finding that has local proof.
function matchRecord(r, skipCountry){
  // Theme is multi-value. A record marked ABC;Transition matches a filter on
  // either — which is the point of the change: cross-cutting evidence used to
  // be invisible to both single-theme filters.
  if (F.theme.length && !F.theme.some(function(t){ return r.theme.indexOf(t)>=0; })) return false;
  if (F.type.length   && F.type.indexOf(r.type)<0) return false;
  if (F.stream.length && F.stream.indexOf(r.stream)<0) return false;
  if (F.level.length  && F.level.indexOf(r.level)<0) return false;
  // Country selection is OR: pick three countries, see evidence from any of them.
  if (!skipCountry && F.countries.length &&
      !F.countries.some(function(c){ return r.countries.indexOf(c)>=0; })) return false;
  if (F.tag     && r.tags.indexOf(F.tag)<0) return false;
  if (F.actor   && r.actors.indexOf(F.actor)<0) return false;
  if (F.q){
    var src = sourceOf(r.source_id);
    var hay = (r.statement+" "+(r.quote||"")+" "+r.id+" "+r.source_id+" "+
               (src?src.title:"")+" "+r.tags.join(" ")+" "+
               r.countries.map(countryName).join(" ")).toLowerCase();
    if (hay.indexOf(F.q)<0) return false;
  }
  return true;
}
function sourceOf(sid){
  for (var i=0;i<D.sources.length;i++) if (D.sources[i].source_id===sid) return D.sources[i];
  return null;
}
function filtered(skipCountry){
  var recs = D.records.filter(function(r){ return matchRecord(r, skipCountry); });
  var keep = {};
  recs.forEach(function(r){ keep[r.finding_id || ("_solo_"+r.id)] = true; });
  var finds = D.findings.filter(function(f){
    if (!keep[f.finding_id]) return false;
    if (F.strength.length && F.strength.indexOf(f.strength)<0) return false;
    return true;
  });
  var fset = {}; finds.forEach(function(f){ fset[f.finding_id]=true; });
  recs = recs.filter(function(r){ return fset[r.finding_id || ("_solo_"+r.id)]; });
  return { records: recs, findings: finds };
}

// --- render ----------------------------------------------------------------
function render(){
  var d = filtered();
  var hideFilters = !!NOFILTER[TAB];
  document.querySelector(".filters").classList.toggle("hidden", hideFilters);
  el("count").classList.toggle("hidden", hideFilters);
  el("count").textContent =
    d.findings.length + " finding" + (d.findings.length===1?"":"s") + " · " +
    d.records.length + " evidence record" + (d.records.length===1?"":"s") +
    (activeFilters() ? " (filtered)" : "");
  if (!hideFilters) selectedCountryChips();
  var v = el("view");
  if (TAB==="about")      v.innerHTML = viewAbout();
  if (TAB==="highlights") v.innerHTML = viewHighlights(d);
  if (TAB==="findings")   v.innerHTML = viewMap() + viewFindings(d);
  if (TAB==="sources")    v.innerHTML = viewSources(d);
  wire();
}
function activeFilters(){
  return !!(F.q||F.countries.length||F.tag||F.actor||F.theme.length||F.type.length||
            F.stream.length||F.strength.length||F.level.length);
}

// One pill per theme. A finding covering both shows both, rather than a third
// "Both" pill that belonged to neither filter.
function themePills(themes){
  return (themes||[]).map(function(t){
    return '<span class="pill '+esc(t)+'">'+esc(label("theme",t))+'</span>';
  }).join("");
}

function viewFindings(d){
  if (!d.findings.length) return empty();
  var byF = {};
  d.records.forEach(function(r){
    var k = r.finding_id || ("_solo_"+r.id);
    (byF[k] = byF[k] || []).push(r);
  });

  var g = GROUPS[GROUPBY];
  if (!g) return d.findings.map(card).join("");

  var buckets = {}, seen = [];
  d.findings.forEach(function(f){
    var k = g.of(f);
    if (!buckets[k]) { buckets[k] = []; seen.push(k); }
    buckets[k].push(f);
  });
  // Known values in their intended order first, then anything else alphabetically.
  var keys = g.order.filter(function(k){ return buckets[k]; })
    .concat(seen.filter(function(k){ return g.order.indexOf(k)<0; }).sort());

  return keys.map(function(k){
    var items = buckets[k];
    return '<h2 class="grp">' + esc(g.label(k)) +
           '<span class="grp-n">' + items.length + '</span></h2>' +
           items.map(card).join("");
  }).join("");

  function card(f){
    var recs = byF[f.finding_id] || [];
    var open = !!OPEN[f.finding_id];
    var head =
      '<h3>'+esc(f.statement)+'</h3>' +
      (f.example ? '<p class="eg">'+esc(f.example)+'</p>' : '') +
      '<div class="meta">' + themePills(f.theme) +
      '<span class="pill '+esc(f.type)+'">'+esc(label("type",f.type))+'</span>' +
      '<span class="str '+esc(f.strength)+'">'+esc(f.strength)+' strength</span>' +
      '<span class="tag">'+f.n_sources+' source'+(f.n_sources===1?"":"s")+
        ' · '+f.n_streams+' stream'+(f.n_streams===1?"":"s")+'</span>' +
      (f.unmerged ? '<span class="tag" style="color:#B33A3A">not yet merged</span>' : '') +
      f.countries.map(function(c){ return '<span class="tag">'+esc(countryName(c))+'</span>'; }).join("") +
      f.tags.map(function(t){ return '<span class="tag">'+esc(label("tags",t))+'</span>'; }).join("") +
      '</div>';
    var body = open ? '<div class="detail">' + recs.map(evidenceBlock).join("") + '</div>' : "";
    return '<div class="card '+esc(f.type)+'" data-f="'+esc(f.finding_id)+'">'+head+body+'</div>';
  }
}

// Verbatim quotes are stripped at build time and are not available here.
function evidenceBlock(r){
  var s = sourceOf(r.source_id);
  return '<div class="ev"><p>'+esc(r.statement)+'</p>' +
    '<div class="evmeta">' + esc(r.id) + ' · ' + esc(label("stream", r.stream)) +
    ' · ' + esc(r.source_id) + (s ? ' ' + esc(s.title) : '') +
    (r.date_collected ? ' · ' + esc(r.date_collected) : '') +
    ' · ' + esc(r.status) +
    (r.countries.length ? ' · ' + r.countries.map(countryName).map(esc).join(", ") : '') +
    '</div></div>';
}

function viewAbout(){
  var a = D.about;
  if (!a) return empty("data/about.json is missing.");
  var s = D.stats;

  // Scale first. A coordinator wants to know how big this is before reading
  // anything about how it works.
  var h = '<div class="prose"><h2>' + esc(a.title) + '</h2>' +
    '<p class="lead">' + esc(a.intro) + '</p>' +
    '<div class="aboutstats">' +
      stat(s.findings, "Findings") + stat(s.records, "Evidence records") +
      stat(s.sources, "Sources") + stat(s.countries, "Countries") +
    '</div>' +
    '<p class="note">Last rebuilt ' + esc(D.generated) + '.</p>';

  (a.sections||[]).forEach(function(sec){
    h += '<h3>' + esc(sec.heading) + '</h3>';
    (sec.body||[]).forEach(function(p){ h += '<p>' + esc(p) + '</p>'; });
    if (sec.list) h += '<ul>' + sec.list.map(function(li){ return '<li>'+esc(li)+'</li>'; }).join("") + '</ul>';
  });

  h += '<h3>What "strength" means</h3><p>' + esc(a.strength_intro) + '</p>' +
       '<table class="strengthtable"><thead><tr><th>Strength</th><th>When it applies</th>' +
       '<th>How to read it</th></tr></thead><tbody>' +
       (a.strength||[]).map(function(x){
         return '<tr><td><span class="str '+esc(x.level)+'">'+esc(x.level)+'</span></td>' +
                '<td>'+esc(x.rule)+'</td><td>'+esc(x.meaning)+'</td></tr>';
       }).join("") + '</tbody></table>' +
       '<p class="note">' + esc(a.strength_note) + '</p>';

  h += '<h3>Read this with care</h3><ul class="caveats">' +
       (a.caveats||[]).map(function(c){ return '<li>'+esc(c)+'</li>'; }).join("") + '</ul>';

  if (a.footer_note) h += '<p class="note">' + esc(a.footer_note) + '</p>';
  return h + '</div>';
}

function viewHighlights(d){
  var hi = d.findings.filter(function(f){ return f.strength==="high"; });
  if (!hi.length) return empty(
    "No high-strength findings match these filters. A finding reaches high strength once three independent sources, or two different kinds of source, support it.");

  // Three columns, ten each. A finding carrying more than one theme goes in the
  // first column only — previously it appeared under every theme it touched,
  // so the area-based findings were showing up twice on the same page.
  var COLS = [
    { key:"general",     title:"General coordination",     note:"Applies whatever the configuration" },
    { key:"ABC",         title:"Area-Based Coordination",  note:"Specific to organising by area" },
    { key:"Transition",  title:"Transition",               note:"Specific to handing over or winding down" }
  ];
  var TOP = 10;

  function column(f){
    if (f.theme.length > 1) return 0;          // cross-cutting -> general
    if (f.theme[0] === "ABC") return 1;
    if (f.theme[0] === "Transition") return 2;
    return 0;                                   // Fundamentals
  }
  function weight(a, b){
    var ra = (a.highlight&&a.highlight.rank) || 99, rb = (b.highlight&&b.highlight.rank) || 99;
    if (ra !== rb) return ra - rb;                          // curated order first
    if (b.n_sources !== a.n_sources) return b.n_sources - a.n_sources;
    if (b.n_records !== a.n_records) return b.n_records - a.n_records;
    return b.countries.length - a.countries.length;         // then weight of evidence
  }

  var buckets = [[],[],[]];
  hi.forEach(function(f){ buckets[column(f)].push(f); });
  buckets.forEach(function(b){ b.sort(weight); });

  var shownTotal = buckets.reduce(function(n,b){ return n + Math.min(b.length, TOP); }, 0);
  var intro = '<p class="count">' + hi.length + ' finding' + (hi.length===1?"":"s") +
    ' rest on several independent sources. The strongest ' + shownTotal +
    ' are below, grouped by what they apply to. Everything else is in the Findings tab, with its strength shown.</p>';

  var grid = '<div class="hlgrid">' + COLS.map(function(c, ix){
    var items = buckets[ix].slice(0, TOP);
    return '<section class="hlcol"><h2 class="grp">' + esc(c.title) +
      '<span class="grp-n">' + items.length +
      (buckets[ix].length > items.length ? ' of ' + buckets[ix].length : '') + '</span></h2>' +
      '<p class="hlnote">' + esc(c.note) + '</p>' +
      (items.length ? items.map(hlCard).join("")
                    : '<p class="hlnote">Nothing at high strength here yet.</p>') +
      '</section>';
  }).join("") + '</div>';

  return intro + grid;

  function hlCard(f){
    var H = f.highlight || {};
    return '<div class="hl">' +
      '<h3>' + esc(H.headline || f.statement) + '</h3>' +
      (H.plain ? '<p class="hl-plain">' + esc(H.plain) + '</p>'
               : '<p class="hl-plain">' + esc(f.statement) + '</p>') +
      (H.so_what ? '<p class="hl-so"><b>What to do</b> · ' + esc(H.so_what) + '</p>' : '') +
      '<div class="meta">' + themePills(f.theme) +
        '<span class="pill '+esc(f.type)+'">'+esc(label("type",f.type))+'</span>' +
        '<span class="tag">' + f.n_sources + ' sources · ' + f.countries.length +
          ' countr' + (f.countries.length===1?'y':'ies') + '</span>' +
      '</div></div>';
  }
}

// --- map -------------------------------------------------------------------
// Country counts are computed ignoring the country filter, so the map keeps
// showing every country you could add while a selection is active.
function countryCounts(){
  var d = filtered(true), m = {};
  d.records.forEach(function(r){
    r.countries.forEach(function(c){
      m[c] = m[c] || {recs:0, finds:{}};
      m[c].recs++; m[c].finds[r.finding_id || r.id] = true;
    });
  });
  Object.keys(m).forEach(function(c){ m[c].n = Object.keys(m[c].finds).length; });
  return m;
}

function toggleCountry(iso, forceOn){
  var i = F.countries.indexOf(iso);
  if (i<0) F.countries.push(iso);
  else if (!forceOn) F.countries.splice(i,1);
  render();
}

function selectedCountryChips(){
  var host = el("selcountries");
  el("selrow").classList.toggle("hidden", !F.countries.length);
  host.innerHTML = F.countries.map(function(c){
    return '<button class="chip on selc" data-c="'+esc(c)+'">'+esc(countryName(c))+' ×</button>';
  }).join(" ") + (F.countries.length>1
      ? ' <span class="note-inline">showing evidence from any of these</span>' : '');
}

// Horizontal extent of an SVG path, in viewBox units. Cached — the geometry
// never changes, and this runs on every render.
var _pw = {};
function pathWidth(d){
  if (_pw[d] != null) return _pw[d];
  var nums = d.match(/-?\d+(?:\.\d+)?/g) || [];
  var lo = Infinity, hi = -Infinity;
  for (var i = 0; i < nums.length; i += 2) {
    var x = parseFloat(nums[i]);
    if (x < lo) lo = x;
    if (x > hi) hi = x;
  }
  return (_pw[d] = (hi > lo ? hi - lo : 0));
}

function viewMap(){
  var G = window.GEO_DATA;
  if (!G) return '';
  var m = countryCounts();
  var max = 0;
  Object.keys(m).forEach(function(c){ if (m[c].n>max) max = m[c].n; });

  var shapes = Object.keys(m).filter(function(c){ return G.countries[c]; }).map(function(c){
    var sel = F.countries.indexOf(c)>=0;
    var a = max ? m[c].n/max : 0;
    var fill = 'rgba(31,92,139,'+(0.22+a*0.70).toFixed(2)+')';
    return '<path class="cty'+(sel?' sel':'')+'" data-c="'+esc(c)+'" d="'+G.countries[c]+'" ' +
           'fill="'+fill+'"><title>'+esc(countryName(c))+' — '+m[c].n+
           ' finding'+(m[c].n===1?'':'s')+', '+m[c].recs+' record'+(m[c].recs===1?'':'s')+
           '\n'+(F.countries.indexOf(c)>=0?'click to remove':'click to filter')+'</title></path>';
  }).join("");

  // ISO3 labels at the country centroid. Only where the shape is actually wide
  // enough to hold three characters — labelling every country puts BFA, MLI,
  // NER, TCD, CMR and CAF on top of each other in West Africa, and prints text
  // wider than the country on Lebanon and Palestine. Everything unlabelled is
  // still reachable by hover and by the list underneath, which is the reliable
  // route anyway for anyone who does not already know the map.
  // Two passes. First drop anything whose shape is too narrow to hold three
  // characters. Then drop whatever would collide with a label already placed,
  // working from the most evidence to the least, so where West Africa is too
  // crowded for all of them the country with more findings keeps its label.
  var placed = [];
  var labels = Object.keys(m)
    .filter(function(c){
      return G.countries[c] && G.centroids[c] && pathWidth(G.countries[c]) >= 15;
    })
    .sort(function(a,b){ return m[b].n - m[a].n; })
    .filter(function(c){
      var p = G.centroids[c];
      var clash = placed.some(function(q){
        return Math.abs(q[0]-p[0]) < 13 && Math.abs(q[1]-p[1]) < 7;
      });
      if (!clash) placed.push(p);
      return !clash;
    })
    .map(function(c){
      var p = G.centroids[c];
      return '<text class="ctyl'+(F.countries.indexOf(c)>=0?' sel':'')+
             '" x="'+p[0]+'" y="'+p[1]+'" data-c="'+esc(c)+'">'+esc(c)+'</text>';
    }).join("");

  // countries with no geometry (regional codes) get chips instead
  var noGeo = Object.keys(m).filter(function(c){ return !G.countries[c]; });

  var withEvidence = Object.keys(m).length;
  return '<div class="mapwrap"><div class="maphead">' +
      '<span>' + withEvidence + ' countries with evidence · click to filter, click again to remove</span>' +
      '<button class="linkbtn" id="mapToggle">' + (MAPON?'Hide map':'Show map') + '</button></div>' +
    (MAPON ?
      '<svg viewBox="'+G.viewBox+'" class="map" role="img" aria-label="Countries with evidence">' +
        '<path d="'+G.world+'" class="land"/>' + shapes + labels +
      '</svg>' +
      '<div class="maplegend"><span class="lg lo"></span>fewer findings' +
        '<span class="lg hi"></span>more findings' +
        '<span class="lgnote">Shading shows how much evidence exists, not how strong it is.</span></div>' +
      (noGeo.length ? '<div class="meta" style="margin-top:8px"><span class="flabel">No map shape</span>' +
        noGeo.map(function(c){ return '<button class="chip'+(F.countries.indexOf(c)>=0?' on':'')+
          ' selc-add" data-c="'+esc(c)+'">'+esc(countryName(c))+'</button>'; }).join(" ") + '</div>' : '')
    : '') +
    // The same filter as the map, as a plain list. A map is a poor interface if
    // you do not already know where a country is, and it cannot show a count.
    '<div class="ctylist"><div class="maphead"><span>Or choose from the list</span></div>' +
      Object.keys(m).sort(function(a,b){
        return countryName(a).localeCompare(countryName(b)); })
      .map(function(c){
        return '<button class="ctybtn'+(F.countries.indexOf(c)>=0?' on':'')+
          '" data-c="'+esc(c)+'"><span>'+esc(countryName(c))+'</span>' +
          '<span class="ctyn">'+m[c].n+'</span></button>';
      }).join("") +
    '</div></div>';
}


function viewSources(d){
  var cited = {};
  D.records.forEach(function(r){
    (cited[r.source_id] = cited[r.source_id] || []).push(r.finding_id||r.id);
  });
  return '<table><thead><tr><th>ID</th><th>Title</th><th>Year</th><th>Type</th>' +
    '<th>Stream</th><th>Access</th><th>Cited in</th></tr></thead><tbody>' +
    D.sources.map(function(s){
      var c = uniq(cited[s.source_id]||[]);
      return '<tr><td>'+esc(s.source_id)+'</td>' +
        '<td>'+(s.url ? '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a>' : esc(s.title))+'</td>' +
        '<td>'+esc(s.year||"")+'</td><td>'+esc(label("source_type", s.type))+'</td>' +
        '<td>'+esc(label("stream", s.stream))+'</td><td>'+esc(s.access||"")+'</td>' +
        '<td>'+(c.length ? esc(c.join(", ")) : '<span style="color:#B33A3A">not cited</span>')+'</td></tr>';
    }).join("") + '</tbody></table>';
}

function empty(msg){
  return '<div class="empty">'+esc(msg||"Nothing matches these filters.")+'</div>';
}

function wire(){
  document.querySelectorAll(".card").forEach(function(c){
    c.onclick = function(){
      var k = c.dataset.f; OPEN[k] = !OPEN[k]; render();
    };
  });
  document.querySelectorAll("path.cty, .selc, .selc-add, .ctybtn").forEach(function(n){
    n.onclick = function(e){ e.stopPropagation(); toggleCountry(n.dataset.c || n.getAttribute("data-c")); };
  });
  var mt = el("mapToggle");
  if (mt) mt.onclick = function(){ MAPON = !MAPON; render(); };
  document.querySelectorAll("td.n[data-tag]").forEach(function(td){
    td.onclick = function(){
      F.tag = td.dataset.tag; el("tag").value = F.tag;
      F.type = [td.dataset.type];
      document.querySelectorAll('.chip[data-k=type]').forEach(function(ch){
        ch.classList.toggle("on", ch.dataset.v===td.dataset.type); });
      TAB = "findings";
      [].forEach.call(el("nav").children, function(c){
        c.setAttribute("aria-selected", c.dataset.tab==="findings"); });
      render();
    };
  });
}
</script>
</body>
</html>
